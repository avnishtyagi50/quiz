<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Online Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="leftSide">
      <img src="1.jpeg" alt="Quiz logo" class="tilt" />
      <h1>Online Quiz</h1>
    </div>
    <div class="rightSide">
      <h1>Welcome to Online Quiz</h1>
      <h3 id="welcomeUser"></h3> <!-- 👈 Username will appear here -->

      <h2>Feature :-</h2>
      <ul>
        <li>10 Questions (10 sec each)</li>
        <li>100 Seconds timer</li>
        <li>Random Questions</li>
        <li>Get Result any Timer</li>
      </ul>

      <div class="buttonBox">
        <a href="question.html">Let's Start Quiz</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="jquery-3.5.1.min.js"></script>
  <script src="tilt.jquery.min.js"></script>

  <script>
    $(".tilt").tilt({
      scale: 1.2,
    });

    // Get user from localStorage
    const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));

    // Show username or guest
    if (loggedInUser && loggedInUser.username) {
      document.getElementById("welcomeUser").textContent = `Hello, ${loggedInUser.username}!`;
    } else {
      document.getElementById("welcomeUser").textContent = "Hello, Guest!";
    }
  </script>
</body>
</html>
