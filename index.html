<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Sign In / Sign Up Form</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
      font-family: Arial, sans-serif;
    }

    .form-container {
      background: #fff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }

    .form-container h2 {
      margin-bottom: 1rem;
    }

    .form-container input[type="text"],
    .form-container input[type="password"],
    .form-container input[type="email"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      transition: 0.3s;
    }

    .form-container input:focus {
      border-color: #74ebd5;
      outline: none;
    }

    .form-container button {
      width: 100%;
      padding: 10px;
      background-color: #74ebd5;
      border: none;
      color: #fff;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 0.5rem;
    }

    .form-container button:hover {
      background-color: #58c7b6;
    }

    .toggle-link {
      margin-top: 1rem;
      display: block;
      color: #333;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: underline;
    }

    .message {
      text-align: center;
      margin-top: 1rem;
      color: red;
      font-size: 0.9rem;
      height: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2 id="formTitle">Sign In</h2>
    <form id="authForm">
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <input type="email" id="email" placeholder="Email" style="display:none;">
      <button type="submit" id="submitButton">Login</button>
    </form>
    <div class="message" id="message"></div>
    <span class="toggle-link" id="toggleForm">Don't have an account? Sign Up</span>
  </div>

  <script>
    const authForm = document.getElementById('authForm');
    const message = document.getElementById('message');
    const toggleForm = document.getElementById('toggleForm');
    const formTitle = document.getElementById('formTitle');
    const emailField = document.getElementById('email');
    const submitButton = document.getElementById('submitButton');
  
    let isLogin = true;
  
    toggleForm.addEventListener('click', function () {
      isLogin = !isLogin;
      if (isLogin) {
        formTitle.textContent = 'Sign In';
        submitButton.textContent = 'Login';
        toggleForm.textContent = "Don't have an account? Sign Up";
        emailField.style.display = 'none';
      } else {
        formTitle.textContent = 'Sign Up';
        submitButton.textContent = 'Sign Up';
        toggleForm.textContent = 'Already have an account? Sign In';
        emailField.style.display = 'block';
      }
      message.textContent = '';
    });
  
    authForm.addEventListener('submit', function (event) {
      event.preventDefault();
  
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const email = document.getElementById('email').value.trim();
  
      const users = JSON.parse(localStorage.getItem("users")) || [];
  
      if (!username || !password || (!isLogin && !email)) {
        message.style.color = 'red';
        message.textContent = 'Please fill in all required fields.';
        return;
      }
  
      if (isLogin) {
        const matchedUser = users.find(user => user.username === username && user.password === password);
        if (matchedUser) {
          message.style.color = 'green';
          message.textContent = 'Login successful! Redirecting...';
          localStorage.setItem("loggedInUser", JSON.stringify(matchedUser));
          setTimeout(() => {
            window.location.href = 'main.html';
          }, 1500);
        } else {
          message.style.color = 'red';
          message.textContent = 'Invalid username or password.';
        }
      } else {
        const exists = users.some(user => user.username === username);
        if (exists) {
          message.style.color = 'red';
          message.textContent = 'Username already exists.';
          return;
        }
  
        const newUser = { username, password, email };
        users.push(newUser);
        localStorage.setItem("users", JSON.stringify(users));
        message.style.color = 'green';
        message.textContent = 'Signup successful! You can now login.';
        toggleForm.click();
      }
    });
  </script>
  

</body>


</html>
